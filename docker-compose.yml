services:
  diptera:
    build: .
    image: diptera:unified
    container_name: diptera
    ports:
      - "${APP_PORT:-8787}:8787"
    environment:
      DEFAULT_WORKSPACE: "${DEFAULT_WORKSPACE:-asoc}"
      ASOC_N8N_BASE_URL: "${ASOC_N8N_BASE_URL:-http://10.20.100.65:5678}"
      ASOC_FORM_PATH: "${ASOC_FORM_PATH:-alpha-form}"
      ASOC_IRIS_BASE_URL: "${ASOC_IRIS_BASE_URL:-https://10.20.100.66}"
      ASOC_CALLBACK_URL: "${ASOC_CALLBACK_URL:-http://10.20.100.117:8787/api/n8n-callback}"
      ASOC_CASE_ID_MODE: "${ASOC_CASE_ID_MODE:-auto_iris}"
      ASOC_TENANT_OPTIONS: '${ASOC_TENANT_OPTIONS:-["wicida","instikibali","petra","praditauniversity","sgu","ikmicirebon"]}'
      SOC_N8N_BASE_URL: "${SOC_N8N_BASE_URL:-http://10.20.100.134:5678}"
      SOC_FORM_PATH: "${SOC_FORM_PATH:-Job-Creator}"
      SOC_IRIS_BASE_URL: "${SOC_IRIS_BASE_URL:-}"
      SOC_TENANT_OPTIONS: '${SOC_TENANT_OPTIONS:-["petra","praditauniversity","wicida","instikibali","ikmicirebon","sgu"]}'
      DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
