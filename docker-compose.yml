services:
  postgres:
    image: postgres:16-alpine
    container_name: diptera-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-diptera}"
      POSTGRES_USER: "${POSTGRES_USER:-diptera}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-diptera_secret_change_me}"
    volumes:
      - diptera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diptera} -d ${POSTGRES_DB:-diptera}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  diptera:
    build: .
    image: diptera:unified
    container_name: diptera
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8787}:8787"
    environment:
      DEFAULT_WORKSPACE: "${DEFAULT_WORKSPACE:-asoc}"
      ASOC_N8N_BASE_URL: "${ASOC_N8N_BASE_URL:-http://10.20.100.65:5678}"
      ASOC_FORM_PATH: "${ASOC_FORM_PATH:-alpha-form}"
      ASOC_IRIS_BASE_URL: "${ASOC_IRIS_BASE_URL:-https://10.20.100.66}"
      ASOC_CALLBACK_URL: "${ASOC_CALLBACK_URL:-http://10.20.100.117:8787/api/n8n-callback}"
      ASOC_CASE_ID_MODE: "${ASOC_CASE_ID_MODE:-auto_iris}"
      ASOC_TENANT_OPTIONS: '${ASOC_TENANT_OPTIONS:-["wicida","instikibali","petra","praditauniversity","sgu","ikmicirebon"]}'
      SOC_N8N_BASE_URL: "${SOC_N8N_BASE_URL:-http://10.20.100.134:5678}"
      SOC_FORM_PATH: "${SOC_FORM_PATH:-Job-Creator}"
      SOC_IRIS_BASE_URL: "${SOC_IRIS_BASE_URL:-}"
      SOC_TENANT_OPTIONS: '${SOC_TENANT_OPTIONS:-["petra","praditauniversity","wicida","instikibali","ikmicirebon","sgu"]}'
      APPROVAL_API_SECRET: "${APPROVAL_API_SECRET:-}"
      APPROVAL_API_SECRET_HASH: "${APPROVAL_API_SECRET_HASH:-}"
      APPROVAL_ALLOWED_HOSTS: "${APPROVAL_ALLOWED_HOSTS:-}"
      APPROVAL_REWRITE_RESUME_HOST: "${APPROVAL_REWRITE_RESUME_HOST:-false}"
      PGHOST: "${PGHOST:-postgres}"
      PGPORT: "${PGPORT:-5432}"
      PGDATABASE: "${POSTGRES_DB:-diptera}"
      PGUSER: "${POSTGRES_USER:-diptera}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-diptera_secret_change_me}"
      DATABASE_URL: "${DATABASE_URL:-}"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_DISPLAY_NAME: "${ADMIN_DISPLAY_NAME:-Administrator}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  diptera_pgdata:
